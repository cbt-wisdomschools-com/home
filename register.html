<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Registration</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 450px;
      padding: 2rem;
      transition: transform 0.2s;
    }

    h2 {
      text-align: center;
      color: #333;
      margin-bottom: 1.5rem;
      font-weight: 600;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 500;
      color: #555;
    }

    input {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 1rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
    }

    button {
      width: 100%;
      background: #667eea;
      color: white;
      border: none;
      padding: 0.75rem;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: #5a67d8;
    }

    button:active {
      transform: scale(0.98);
    }

    .message {
      margin-top: 1.5rem;
      text-align: center;
      font-size: 0.9rem;
      padding: 0.5rem;
      border-radius: 6px;
    }

    .success {
      background: #e6fffa;
      color: #2c7a4d;
      border: 1px solid #9ae6b4;
    }

    .error {
      background: #fff5f5;
      color: #c53030;
      border: 1px solid #fed7d7;
    }

    .info {
      background: #ebf8ff;
      color: #2c5282;
      border: 1px solid #bee3f8;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Create an Account</h2>
    <form id="registerForm">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required autocomplete="off">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
      </div>
      <button type="submit">Register</button>
    </form>
    <div id="message" class="message"></div>
  </div>

  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const messageDiv = document.getElementById('message');
      
      if (!username || !password) {
        messageDiv.innerHTML = 'Please fill in both fields.';
        messageDiv.className = 'message error';
        return;
      }

      messageDiv.innerHTML = 'Sending...';
      messageDiv.className = 'message info';

      try {
        const response = await fetch('https://script.google.com/macros/s/AKfycbwy32GoohfSzFS6Ypa7tgIwQcyoWZux0Awoqwzglx3TpuFVhCb5bP0ya15BL-MsLMGK/exec', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const result = await response.json();
        if (result.success) {
          messageDiv.innerHTML = 'Registration successful!';
          messageDiv.className = 'message success';
          document.getElementById('registerForm').reset();
        } else {
          messageDiv.innerHTML = 'Error: ' + result.error;
          messageDiv.className = 'message error';
        }
      } catch (err) {
        console.error(err);
        messageDiv.innerHTML = 'Network error. Please try again.';
        messageDiv.className = 'message error';
      }
    });
  </script>
</body>
</html>
